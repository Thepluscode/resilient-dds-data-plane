name: DDS failure, security, authority and resource-bound scenarios

on: [push, pull_request]

jobs:
  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned Fast DDS 2.14.6 security image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: rdtf-fastdds:2.14.6
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and validate RTPS, netem, DDS Security, authority and writer resource bounds
        run: |
          docker run --rm \
            --network host \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            -v "$PWD:/work" \
            rdtf-fastdds:2.14.6 \
            bash -lc '
              set -euo pipefail
              fastddsgen -version || true
              cmake -S . -B build-dds -DCMAKE_BUILD_TYPE=Release -DRDTF_ENABLE_FASTDDS=ON
              cmake --build build-dds -j"$(nproc)"
              ctest --test-dir build-dds --output-on-failure
              BUILD=build-dds OUT=evidence ./scripts/run_scenarios.sh
              DURATION=6 BUILD=build-dds OUT=evidence/netem ./scripts/run_netem.sh
              ./scripts/security/generate_test_pki.sh /tmp/rdtf-security-pki
              BUILD=build-dds PKI=/tmp/rdtf-security-pki OUT=evidence/security \
                ./scripts/security/run_security_scenarios.sh
              BUILD=build-dds OUT=evidence/authority ./scripts/run_authority_scenarios.sh
              BUILD=build-dds OUT=evidence/resource-bounds ./scripts/run_resource_bounds.sh
              BUILD=build-dds OUT=evidence/backpressure ./scripts/run_backpressure_scenarios.sh
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dds-evidence
          path: evidence/
